services:
  - type: web
    name: marketpilot-ai
    runtime: python
    rootDir: ai-engine
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: SERPAPI_KEY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: OPENROUTER_MODEL
        value: openrouter/free
      - key: OPENROUTER_BASE_URL
        value: https://openrouter.ai/api/v1
      - key: BACKEND_URL
        sync: false
      - key: FRONTEND_URLS
        sync: false

  - type: web
    name: marketpilot-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    healthCheckPath: /api/evidence
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_USERNAME
        sync: false
      - key: DATABASE_PASSWORD
        sync: false
      - key: AI_ENGINE_URL
        sync: false
      - key: FRONTEND_URL
        sync: false

  - type: web
    name: marketpilot-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_BASE_URL
        sync: false
      - key: VITE_AI_ENGINE_URL
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
